
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Browser Timing Test</title>
</head>
<body>
    <h1>Browser timing diagnostic</h1>

    <script>
        const receiver =
            "https://tpas-csrf-carlos1261.requestcatcher.com";

        function signal(stage) {
            const img = new Image();
            img.src = receiver + "/?stage=" + stage;
        }

        // Se ejecuta inmediatamente.
        signal("start");

        // Comprueba el event loop.
        setTimeout(() => {
            signal("timer0");
        }, 0);

        // Comprueba si llega a 500 ms.
        setTimeout(() => {
            signal("timer500");
        }, 500);

        // Comprueba si llega a 1500 ms.
        setTimeout(() => {
            signal("timer1500");
        }, 1500);

        // Comprueba si llega a 3000 ms.
        setTimeout(() => {
            signal("timer3000");
        }, 3000);
    </script>
</body>
</html>
